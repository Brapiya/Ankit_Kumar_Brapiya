<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Random Number - Brapiya Tools</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#c0392b,#e74c3c);min-height:100vh;}.container{max-width:600px;margin:0 auto;padding:40px 20px;}.card{background:white;border-radius:28px;padding:40px;text-align:center;}input{padding:10px;margin:10px;border:2px solid #ddd;border-radius:12px;width:100px;}button{background:#c0392b;color:white;padding:12px 30px;border:none;border-radius:40px;cursor:pointer;margin:20px 0;}.result{font-size:3rem;font-weight:800;color:#c0392b;padding:20px;}header{background:rgba(0,0,0,0.2);color:white;padding:20px;text-align:center;}
</style></head><body><header><h1><i class="fas fa-dice"></i> Brapiya Random Number Generator</h1></header><div class="container"><div class="card"><div><input type="number" id="min" value="1" placeholder="Min"><input type="number" id="max" value="100" placeholder="Max"></div><button onclick="generate()">Generate Random Number 🎲</button><div class="result" id="result">0</div><p>Click to generate random number between min & max</p></div></div><script>
function generate(){let min=parseInt(document.getElementById('min').value);let max=parseInt(document.getElementById('max').value);if(min>=max){alert('Min should be less than Max');return;}let random=Math.floor(Math.random()*(max-min+1))+min;document.getElementById('result').innerText=random;}
</script></body></html>
