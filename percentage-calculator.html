<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Percentage Calculator - Brapiya Tools</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>
*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#2c3e50,#34495e);min-height:100vh;}.container{max-width:600px;margin:0 auto;padding:40px 20px;}.card{background:white;border-radius:28px;padding:40px;}.calc-box{background:#f0f4f8;padding:20px;border-radius:20px;margin:15px 0;}input{padding:12px;margin:10px;border:2px solid #ddd;border-radius:12px;width:120px;}button{background:#2c3e50;color:white;padding:10px 20px;border:none;border-radius:40px;cursor:pointer;margin-top:10px;}.result{font-size:1.5rem;font-weight:700;color:#2c3e50;margin-top:15px;}header{background:rgba(0,0,0,0.2);color:white;padding:20px;text-align:center;}
</style></head><body><header><h1><i class="fas fa-percent"></i> Brapiya Percentage Calculator</h1></header><div class="container"><div class="card"><div class="calc-box"><h3>What is X% of Y?</h3><input type="number" id="percent" placeholder="X %"><input type="number" id="of" placeholder="of Y"><button onclick="calcPercentOf()">Calculate</button><div class="result" id="percentOfResult"></div></div><div class="calc-box"><h3>X is what percent of Y?</h3><input type="number" id="x" placeholder="X"><input type="number" id="y" placeholder="Y"><button onclick="calcWhatPercent()">Calculate</button><div class="result" id="whatPercentResult"></div></div><div class="calc-box"><h3>Percentage Increase/Decrease</h3><input type="number" id="oldVal" placeholder="Old Value"><input type="number" id="newVal" placeholder="New Value"><button onclick="calcChange()">Calculate</button><div class="result" id="changeResult"></div></div></div></div><script>
function calcPercentOf(){let p=parseFloat(document.getElementById('percent').value);let val=parseFloat(document.getElementById('of').value);if(isNaN(p)||isNaN(val)){alert('Enter numbers');return;}let result=(p/100)*val;document.getElementById('percentOfResult').innerHTML=`${p}% of ${val} = ${result.toFixed(2)}`;}
function calcWhatPercent(){let x=parseFloat(document.getElementById('x').value);let y=parseFloat(document.getElementById('y').value);if(isNaN(x)||isNaN(y)){alert('Enter numbers');return;}let result=(x/y)*100;document.getElementById('whatPercentResult').innerHTML=`${x} is ${result.toFixed(2)}% of ${y}`;}
function calcChange(){let oldV=parseFloat(document.getElementById('oldVal').value);let newV=parseFloat(document.getElementById('newVal').value);if(isNaN(oldV)||isNaN(newV)){alert('Enter numbers');return;}let change=((newV-oldV)/oldV)*100;let sign=change>0?'increase 🔼':'decrease 🔽';document.getElementById('changeResult').innerHTML=`${sign}: ${Math.abs(change).toFixed(2)}% change`;}
</script></body></html>
