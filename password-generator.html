<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Brapiya Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:#f5f7fa;}
        .container{max-width:600px;margin:0 auto;padding:40px 20px;}
        .card{background:white;border-radius:20px;padding:40px;text-align:center;}
        .password-box{background:#f0f4f8;padding:20px;border-radius:15px;margin:20px 0;font-size:1.5rem;font-family:monospace;word-break:break-all;}
        input[type="range"]{width:100%;margin:15px 0;}
        .checkbox-group{text-align:left;margin:20px 0;}
        .checkbox-group label{display:block;margin:10px 0;}
        button{background:#667eea;color:white;padding:12px 30px;border:none;border-radius:40px;cursor:pointer;margin:5px;}
        header{background:#667eea;color:white;padding:20px;text-align:center;}
    </style>
</head>
<body>
    <header><h1><i class="fas fa-lock"></i> Brapiya Password Generator</h1><p>Create strong & secure passwords</p></header>
    <div class="container">
        <div class="card">
            <div class="password-box" id="password">Click Generate</div>
            <label>Password Length: <span id="lengthValue">12</span></label>
            <input type="range" id="length" min="6" max="32" value="12">
            <div class="checkbox-group">
                <label><input type="checkbox" id="uppercase" checked> Include Uppercase (A-Z)</label>
                <label><input type="checkbox" id="lowercase" checked> Include Lowercase (a-z)</label>
                <label><input type="checkbox" id="numbers" checked> Include Numbers (0-9)</label>
                <label><input type="checkbox" id="symbols" checked> Include Symbols (!@#$%)</label>
            </div>
            <button onclick="generatePassword()"><i class="fas fa-sync-alt"></i> Generate</button>
            <button onclick="copyPassword()"><i class="fas fa-copy"></i> Copy</button>
        </div>
    </div>
    <footer style="text-align:center;padding:30px;background:#333;color:white;">
        <p>© 2026 Brapiya Tools | Free Password Generator</p>
    </footer>
    <script>
        document.getElementById('length').addEventListener('input', function(){
            document.getElementById('lengthValue').innerText = this.value;
        });
        function generatePassword(){
            const length = document.getElementById('length').value;
            const hasUpper = document.getElementById('uppercase').checked;
            const hasLower = document.getElementById('lowercase').checked;
            const hasNumbers = document.getElementById('numbers').checked;
            const hasSymbols = document.getElementById('symbols').checked;
            
            let chars = '';
            if(hasUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if(hasLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if(hasNumbers) chars += '0123456789';
            if(hasSymbols) chars += '!@#$%^&*()_+[]{}';
            
            if(chars === ''){ alert('Select at least one option'); return; }
            
            let password = '';
            for(let i=0; i<length; i++){
                password += chars[Math.floor(Math.random() * chars.length)];
            }
            document.getElementById('password').innerText = password;
        }
        function copyPassword(){
            const password = document.getElementById('password').innerText;
            navigator.clipboard.writeText(password);
            alert('✅ Password copied!');
        }
        generatePassword();
    </script>
</body>
</html>
